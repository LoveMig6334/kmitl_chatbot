[project]
name = "thai-llm-kmitl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thatt Bunnag", email = "tom.tom.thanet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=3.3.1",
    "pythainlp>=5.3.7",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
# Local BGE-M3 (index building, RERANK=1, or EMBED_API unset). Not installed in the deployment image.
local-embed = [
    "flagembedding>=1.4.2",
    "torch>=2.14.0",
]

[project.scripts]
thai-llm-kmitl = "thai_llm_kmitl:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
# retrieval/ is the retrieval teammate's vendored pipeline (see docs/retrieval-integration.md) — not linted here.
exclude = ["retrieval", ".venv", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # retrieval/scripts/test_index.py is a CLI, not a pytest module

[[tool.uv.index]]
# CPU-only torch wheels for the Hugging Face Space (Linux); macOS keeps the PyPI wheels.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
